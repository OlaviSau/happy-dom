<div id="external-setattr"></div>
<script>
    const externalSetAttrEl = document.querySelector("#external-setattr");
    externalSetAttrEl.style.color = "red";
    externalSetAttrEl.setAttribute("style", "color: blue;");
    document.querySelector("#external-setattr").textContent = externalSetAttrEl.style.color;
</script>
<div id="external-removeattr"></div>
<script>
    const externalRemoveAttrWork = document.createElement("div");
    externalRemoveAttrWork.style.color = "red";
    externalRemoveAttrWork.removeAttribute("style");
    document.querySelector("#external-removeattr").textContent = externalRemoveAttrWork.style.color;
</script>
<div id="external-remove-length"></div>
<script>
    const externalRemoveLenWork = document.createElement("div");
    externalRemoveLenWork.style.color = "red";
    externalRemoveLenWork.removeAttribute("style");
    document.querySelector("#external-remove-length").textContent = String(externalRemoveLenWork.style.length);
</script>
<div id="external-empty-attr-length"></div>
<script>
    const externalEmptyAttrEl = document.querySelector("#external-empty-attr-length");
    externalEmptyAttrEl.setAttribute("style", "");
    document.querySelector("#external-empty-attr-length").textContent = String(externalEmptyAttrEl.style.length);
</script>
<div id="external-setattr-multi"></div>
<script>
    const externalMultiEl = document.querySelector("#external-setattr-multi");
    externalMultiEl.style.color = "red";
    externalMultiEl.setAttribute("style", "color: green; font-size: 12px;");
    document.querySelector("#external-setattr-multi").textContent = [
        externalMultiEl.style.color,
        externalMultiEl.style.fontSize
    ].join("|");
</script>
