<div id="flex-none"></div>
<script>
    const flexNoneEl = document.createElement("div");
    flexNoneEl.style.flex = "none";
    document.querySelector("#flex-none").textContent = [
        flexNoneEl.style.flexGrow,
        flexNoneEl.style.flexShrink,
        flexNoneEl.style.flexBasis
    ].join("|");
</script>
