<div id="margin-single"></div>
<script>
    const marginSingleEl = document.createElement("div");
    marginSingleEl.style.margin = "10px";
    document.querySelector("#margin-single").textContent = [
        marginSingleEl.style.marginTop,
        marginSingleEl.style.marginRight,
        marginSingleEl.style.marginBottom,
        marginSingleEl.style.marginLeft
    ].join("|");
</script>
